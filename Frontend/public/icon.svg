<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  
  <!-- Decorative Gear/Circuit circles in subtle opacity -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="12 12" opacity="0.2"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
  
  <!-- Sleek Modern "R" Letter & ERP Symbol -->
  <g filter="url(#shadow)">
    <!-- Vertical stem of R -->
    <path d="M160 120 L160 392" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
    <!-- Top loop of R -->
    <path d="M160 142 C240 142 320 142 320 220 C320 298 240 298 160 298" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Leg of R -->
    <path d="M236 290 L336 392" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
    <!-- Accent Diamond / Dot -->
    <circle cx="340" cy="140" r="16" fill="#f59e0b"/>
  </g>
</svg>
